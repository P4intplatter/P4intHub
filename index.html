<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f17">
<title>My Tools</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0d0f17;
    --panel: #1a1d2b;
    --panel-hi: #232745;
    --indigo: #5a60c9;
    --blue: #7c9cf0;
    --text: #e6e9f5;
    --muted: #8b91ad;
    --black: #000;
    --glow: rgba(255, 255, 255, .38);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 32px); }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: .01em; margin: 0 0 6px; }
  p.sub { margin: 0 0 28px; color: var(--muted); font-size: .95rem; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .tile {
    display: flex; flex-direction: column; justify-content: space-between;
    min-height: 150px; padding: 18px; border-radius: 18px;
    background: linear-gradient(160deg, var(--panel-hi), var(--panel));
    border: 2px solid var(--black);
    box-shadow: 0 6px 0 -2px var(--black), 0 10px 22px -12px var(--glow);
    color: inherit; text-decoration: none;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .tile .icon { font-size: 2rem; line-height: 1; }
  .tile .name { font-size: 1.1rem; font-weight: 600; }
  .tile .note { display: block; margin-top: 4px; color: var(--muted); font-size: .82rem; font-weight: 400; }
  .tile:hover, .tile:focus-visible, .tile:active {
    border-color: var(--black);
    box-shadow: 0 6px 0 -2px var(--black), 0 14px 28px -8px var(--glow);
    transform: translateY(-2px);
    outline: none;
  }
  .tile:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .tile:active { transform: translateY(1px); }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>My Tools</h1>
  <p class="sub">Pick something to open.</p>
  <nav class="grid" id="grid" aria-label="Tools"></nav>
</main>

<script>
  // ADD OR EDIT YOUR TOOLS HERE. One block per tool.
  const tools = [
    {
      name: "Braindump",
      note: "Organize your thoughts",
      icon: "🧠",
      url: "https://script.google.com/macros/s/AKfycbwpLEKZo1dPjCNKZA-2f7ShAmLWRdrgtHx5q9iQyPY6WfxfAUfYbuLQmQJLoRVJZJ9O/exec"
    },
    {
      name: "Recipe box",
      note: "Your saved recipes",
      icon: "🍲",
      url: "https://script.google.com/macros/s/AKfycbyqz_N1JrErvustllg2dRLG5RIDY-1285l1JGWltZar6j-fZo7iB1S3cvJ4W8E-aTZ1/exec"
    },
    {
      name: "Booklist",
      note: "Gimme a book!",
      icon: "📚",
      url: "https://script.google.com/macros/s/AKfycbwZe3qX1HWDqyU2Y8ffJOGj60S6VF-UtLGeXm_gU7ANs24BFlY40efA5dVC5KSGzz2nTg/exec"
    },
  ];

  const grid = document.getElementById("grid");
  for (const t of tools) {
    const a = document.createElement("a");
    a.className = "tile";
    a.href = t.url;
    a.innerHTML = '<span class="icon"></span><span class="name"></span>';
    a.querySelector(".icon").textContent = t.icon;
    const name = a.querySelector(".name");
    name.textContent = t.name;
    if (t.note) {
      const n = document.createElement("span");
      n.className = "note";
      n.textContent = t.note;
      name.appendChild(n);
    }
    grid.appendChild(a);
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
